name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies (optional Flow driver included)
        run: npm ci

      - name: Unit, API, stub-generation and mock-Flow tests
        run: npm test

      - name: Smoke test against a live server
        run: |
          VIDMO_FLOW_MODE=stub VIDMO_DATA_DIR="$RUNNER_TEMP/vidmo-data" node server.js &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:4173/api/health > /dev/null && break
            sleep 0.25
          done
          node scripts/smoke.mjs
