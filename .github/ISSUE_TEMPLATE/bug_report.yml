name: Bug report
description: Something in the studio is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please do not report security
        issues here — see [SECURITY.md](../SECURITY.md) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The exact audience, dish (library or custom), and actions you took.
      placeholder: |
        1. npm start
        2. Chose "India & Pakistan" → custom dish "Chicken Karahi"
        3. Clicked "Build the storyboard"
        4. …
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`
      placeholder: v22.x / v24.x
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Server console output, browser console errors, or screenshots.
      render: shell
    validations:
      required: false
